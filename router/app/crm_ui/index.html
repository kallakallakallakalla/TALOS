<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TALOS · Freight desk</title>
  <link rel="stylesheet" href="/crm/assets/crm.css">
  <script>
    // before first paint, so a stored theme does not flash
    try { const t = localStorage.getItem('talos.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="rail glass">
      <div class="brand">
        <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="14" cy="14" r="11"/><path d="M5.500 18.500C10 9 18 7 23 11.500"/><circle cx="23" cy="11.500" r="1.600" fill="currentColor" stroke="none"/>
        </svg>
        <div><b>TALOS</b><span>Air freight desk</span></div>
      </div>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="rail-foot"><span id="mode-line"></span><b id="clock"></b></div>
    </aside>
    <div class="stage">
      <header class="bar glass">
        <div class="grow"><h1 id="title">TALOS</h1><div class="sub" id="sub"></div></div>
        <label class="search"><span class="icon" id="search-icon"></span><input id="search" type="search" placeholder="Search this page  ( / )" aria-label="Search this page"></label>
        <div class="seg" id="source" role="group" aria-label="Data shown"></div>
        <span class="chip" id="live"></span>
        <button class="iconbtn" id="bell" aria-label="Notifications for new cases"></button>
        <button class="iconbtn" id="theme" title="Light or dark" aria-label="Switch between light and dark"></button>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="tip" role="tooltip"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/crm/assets/app.js"></script>
</body>
</html>
