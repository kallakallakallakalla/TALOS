[project]
name = "talos-crm"
version = "0.1.0"
description = "Read-only console over the ultra-talos desk (ADR 58)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",  # FastAPI's TestClient
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["app", "desk", "airports"]
